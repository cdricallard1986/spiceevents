version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    groups:
      correctifs-et-mineures:
        update-types: [patch, minor]
    ignore:
      # Migrent ensemble, à la main, avec la version majeure de Next.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      # eslint-config-next 15 n'accepte qu'ESLint 9 au plus (peerDependencies) :
      # ESLint 10 attend, lui aussi, la migration de Next.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Doit décrire le Node d'exécution (22 sur Vercel).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
